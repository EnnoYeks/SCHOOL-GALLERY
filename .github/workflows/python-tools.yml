name: Python Tools CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-and-site-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest
        run: python -m pytest tests/ -q --tb=short

      - name: Run site_check (dry, expect exit 1 if issues)
        run: |
          python tools/site_check.py --base-url https://hshsgallery.vercel.app --max-pages 5 || true
          # Note: site_check exits 1 on any findings; we log but do not fail the build hard
          # so that known issues do not block unrelated PRs. Adjust as the site stabilizes.
