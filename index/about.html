<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
    <meta charset="UTF-8">
    <meta name="theme-color" content="#6366f1">
    <meta name="description" content="About HSHS World - Share school moments, connect community">
    <title>About - HSHS World</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/hshs-social.css">
    <style>input, textarea, select { font-size: 16px !important; }</style>
</head>
<body class="light-mode">
    <div class="animated-bg">
        <div class="gradient-bg"></div>
        <div class="particles-container" id="particlesContainer"></div>
    </div>

    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <span>HSHS</span>
            </div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search @username or people..." class="search-input" id="searchInput">
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="nav-links"></div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" type="button"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <div id="hshsAboutRoot">
        <div class="hshs-profile-empty">Loading…</div>
    </div>

    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/db.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/hshs-store.js"></script>
    <script type="module" src="../js/pages/about.js"></script>
    <script src="../js/mobile-navigation.js"></script>
</body>
</html>
