<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#071433">
<title>Buzz - HSHS International</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/clips.css">
<link rel="stylesheet" href="../css/hshs-no-flicker.css?v=260903c">
<link rel="stylesheet" href="../css/mobile-shell.css?v=260903c">
<link rel="stylesheet" href="../css/hshs-theme.css?v=260903c">
</head>
<body class="light-mode clips-page">
<div class="animated-bg"><div class="gradient-bg"></div><div class="particles-container" id="particlesContainer"></div></div>
<nav class="navbar"><div class="navbar-container">
<div class="logo"><i class="fas fa-graduation-cap"></i><span>HSHS World</span></div>
<div class="search-container"><i class="fas fa-search"></i><input type="text" class="search-input" id="searchInput" placeholder="Search..."><div class="search-results" id="searchResults"></div></div>
<div class="nav-links"></div>
<div class="nav-actions"><button class="theme-toggle" id="themeToggle" type="button"><i class="fas fa-moon"></i></button></div>
</div></nav>
<div id="app-root" data-page="buzz" aria-live="polite">
<main class="clips-main"><div class="clip-feed" id="clipFeed"></div></main>
<div class="clip-sheet" id="commentSheet"><div class="clip-sheet-handle"></div><h3>Comments</h3><div class="comment-list" id="commentList"></div><form class="comment-form" id="commentForm"><input type="text" id="commentInput" placeholder="Say something kind..." maxlength="160" autocomplete="off"><button type="submit"><i class="fas fa-paper-plane"></i></button></form></div>
<div class="clip-sheet" id="musicSheet"><div class="clip-sheet-handle"></div><h3>School Mix</h3><p class="clip-sheet-note">Pick a track from the school library. Random internet songs are not allowed.</p><div class="music-list" id="musicList"></div></div>
<div class="clip-dim" id="clipDim"></div>
</div>
<script type="module" src="../js/config.js"></script>
<script type="module" src="../js/db.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/clips.js"></script>
<script src="../js/mobile-navigation.js"></script>
<script src="../js/mobile-shell.js?v=260903c"></script>
<script type="module" src="../js/app.js?v=260903c"></script>
<script>(function(){var r=document.documentElement;r.classList.remove('hshs-booting');r.classList.add('hshs-ready');if(document.body)document.body.classList.add('has-mobile-shell');})();</script>
</body></html>
