<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
    <meta name="theme-color" content="#071433">
    <title>Notifications - HSHS World</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/hshs-account.css">
</head>
<body class="light-mode">
    <div class="animated-bg">
        <div class="gradient-bg"></div>
        <div class="particles-container" id="particlesContainer"></div>
    </div>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo"><i class="fas fa-graduation-cap"></i><span>HSHS World</span></div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search..." class="search-input" id="searchInput">
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="nav-links">
                <a href="../index.html" class="nav-link"><i class="fas fa-home"></i><span>Home</span></a>
                <a href="gallery.html" class="nav-link"><i class="fas fa-images"></i><span>Gallery</span></a>
                <a href="notifications.html" class="nav-link active"><i class="fas fa-bell"></i><span>Alerts</span></a>
            </div>
            <div class="nav-actions">
                <div class="notification-icon">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="notificationBadge">0</span>
                </div>
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
                <div class="profile-icon">
                    <img src="https://via.placeholder.com/40" alt="Profile" class="profile-img" id="profileImg">
                </div>
            </div>
        </div>
    </nav>
    <main class="hshs-account-page">
        <div class="hshs-page-head">
            <a class="hshs-back" href="more.html" aria-label="Back"><i class="fas fa-chevron-left"></i></a>
            <h1>Notifications</h1>
            <button type="button" class="hshs-text-btn" id="hshsMarkRead">Mark all read</button>
        </div>
        <div class="hshs-tabs">
            <button type="button" class="hshs-tab on" data-notif-tab="all">All</button>
            <button type="button" class="hshs-tab" data-notif-tab="mentions">Mentions</button>
            <button type="button" class="hshs-tab" data-notif-tab="school">School</button>
        </div>
        <div id="hshsNotifList"></div>
    </main>
    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/db.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/particles.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/mobile-navigation.js"></script>
</body>
</html>
