<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#071433">
<title>Photos - HSHS World</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/photos.css">
<link rel="stylesheet" href="../css/hshs-no-flicker.css?v=260903b">
<link rel="stylesheet" href="../css/mobile-shell.css?v=260903b">
<link rel="stylesheet" href="../css/hshs-theme.css?v=260903b">
<style>input, textarea, select { font-size: 16px !important; }</style>
</head>
<body class="light-mode">
<div class="animated-bg"><div class="gradient-bg"></div><div class="particles-container" id="particlesContainer"></div><div class="floating-shapes"><div class="shape shape-1"></div><div class="shape shape-2"></div><div class="shape shape-3"></div><div class="shape shape-4"></div></div></div>
<nav class="navbar"><div class="navbar-container">
<div class="logo"><i class="fas fa-graduation-cap"></i><span>HSHS World</span></div>
<div class="search-container"><i class="fas fa-search"></i><input type="text" placeholder="Search photos..." class="search-input" id="searchInput"><div class="search-results" id="searchResults"></div></div>
<div class="nav-links">
<a href="../index.html" class="nav-link"><i class="fas fa-home"></i><span>Home</span></a>
<a href="gallery.html" class="nav-link"><i class="fas fa-images"></i><span>Gallery</span></a>
<a href="photos.html" class="nav-link active"><i class="fas fa-photo-video"></i><span>Photos</span></a>
<a href="videos.html" class="nav-link"><i class="fas fa-video"></i><span>Vibe</span></a>
<a href="trending.html" class="nav-link"><i class="fas fa-fire"></i><span>Trending</span></a>
</div>
<div class="nav-actions">
<div class="notification-icon"><i class="fas fa-bell"></i><span class="notification-badge" id="notificationBadge">0</span></div>
<button class="theme-toggle" id="themeToggle" type="button"><i class="fas fa-moon"></i></button>
<div class="profile-icon"><img src="https://via.placeholder.com/40" alt="Profile" class="profile-img" id="profileImg"></div>
<button class="mobile-menu-toggle" id="mobileMenuToggle" type="button"><i class="fas fa-bars"></i></button>
</div></div></nav>
<div id="app-root" data-page="photos" aria-live="polite">
<div class="photos-container">
<div class="photos-search">
<input type="text" class="search-input-field" id="photoSearchInput" placeholder="Search photos by title, category...">
<button class="search-submit" type="button"><i class="fas fa-search"></i> Search</button>
</div>
<div class="filter-bar" id="filterBar">
<button class="filter-btn active" data-filter="all">All Photos</button>
<button class="filter-btn" data-filter="popular">Most Popular</button>
<button class="filter-btn" data-filter="recent">Most Recent</button>
<button class="filter-btn" data-filter="trending">Trending</button>
</div>
<div class="masonry-grid" id="masonryGrid">
<div class="loading-skeleton"></div><div class="loading-skeleton"></div><div class="loading-skeleton"></div>
<div class="loading-skeleton"></div><div class="loading-skeleton"></div><div class="loading-skeleton"></div>
</div>
</div>
<div class="photo-modal" id="photoModal">
<div class="modal-content">
<button class="modal-close" id="modalClose" aria-label="Close"><i class="fas fa-times"></i></button>
<img src="" alt="Full Photo" class="modal-image" id="modalImage">
<div class="modal-info">
<div class="modal-title" id="modalTitle">Photo Title</div>
<div class="modal-description" id="modalDescription">Photo description goes here</div>
<div class="modal-actions">
<button class="modal-action-btn" type="button"><i class="fas fa-heart"></i> Like</button>
<button class="modal-action-btn secondary" type="button"><i class="fas fa-comment"></i> Comment</button>
<button class="modal-action-btn secondary" type="button"><i class="fas fa-share"></i> Share</button>
<button class="modal-action-btn secondary" type="button"><i class="fas fa-download"></i> Download</button>
</div></div></div></div>
<div class="photo-details" id="photoDetails">
<button class="details-close" type="button"><i class="fas fa-times"></i></button>
<div class="detail-section"><div class="detail-title">Title</div><div class="detail-content" id="detailTitle">Loading...</div></div>
<div class="detail-section"><div class="detail-title">Category</div><div class="detail-content" id="detailCategory">Loading...</div></div>
<div class="detail-section"><div class="detail-title">Uploaded By</div><div class="detail-content" id="detailAuthor">Loading...</div></div>
<div class="detail-section"><div class="detail-title">Date</div><div class="detail-content" id="detailDate">Loading...</div></div>
</div>
</div>
<script type="module" src="../js/config.js"></script>
<script type="module" src="../js/db.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/particles.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/search.js"></script>
<script src="../js/photos.js"></script>
<script src="../js/mobile-navigation.js"></script>
<script src="../js/mobile-shell.js?v=260903b"></script>
<script src="../js/mobile-search-btn.js?v=260903b"></script>
<script type="module" src="../js/app.js?v=260903b"></script>
<script>(function(){var r=document.documentElement;r.classList.remove('hshs-booting');r.classList.add('hshs-ready');if(document.body)document.body.classList.add('has-mobile-shell');window.dispatchEvent(new CustomEvent('app:page:loaded'));})();</script>
</body></html>
