<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Memories - HSHS World</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/mobile-shell.css?v=260903e"><link rel="stylesheet" href="../css/hshs-theme.css?v=260903e"><link rel="stylesheet" href="../css/hshs-campus-wire.css?v=260903e"></head>
<body class="dark-mode has-mobile-shell"><nav class="navbar"><div class="navbar-container"><div class="logo"><span>HSHS World</span></div></div></nav>
<div id="app-root" data-page="memories"><div class="container" style="padding:1.2rem;position:relative;z-index:10">
<div style="background:linear-gradient(135deg,#0b1f4d,#1d4ed8);border-radius:20px;padding:2rem;color:white;margin-bottom:1.2rem;text-align:center"><h1><i class="fas fa-clock"></i> Memories</h1><p>Relive your favorite school moments</p></div>
<div class="hshs-me-card" style="display:block"><h2>On This Day</h2><p>Memories from <strong id="todayDate">today</strong></p><div id="onThisDayGrid"></div></div>

<div class="hshs-me-card" style="display:block;margin-top:10px"><h2>School Timeline</h2><div id="schoolTimeline"></div></div>
</div></div>
