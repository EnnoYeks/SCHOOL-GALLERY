<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Memories - HSHS World</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/responsive.css"><link rel="stylesheet" href="../css/mobile-shell.css?v=260903c"></head>
<body class="light-mode"><div class="animated-bg"><div class="gradient-bg"></div></div>
<nav class="navbar"><div class="navbar-container"><div class="logo"><i class="fas fa-graduation-cap"></i><span>HSHS World</span></div></div></nav>
<div id="app-root" data-page="memories">
<div class="container" style="padding:2rem;position:relative;z-index:10;margin-top:60px">
<div style="background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));border-radius:20px;padding:3rem;color:white;margin-bottom:3rem;text-align:center"><h1 style="font-size:2.5rem;font-weight:800"><i class="fas fa-clock"></i> Memories</h1><p>Relive your favorite school moments</p></div>
<div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:15px;padding:2rem;margin-bottom:2rem"><h2 class="section-title"><i class="fas fa-calendar-day"></i> On This Day</h2><p>Memories from <strong id="todayDate">today</strong> in previous years</p><div class="featured-grid" id="onThisDayGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:2rem"><div class="loading-skeleton"></div><div class="loading-skeleton"></div><div class="loading-skeleton"></div></div></div>
<div style="background:linear-gradient(135deg,var(--accent-color),var(--secondary-color));border-radius:15px;padding:2rem;color:white;margin-bottom:2rem;text-align:center"><h2><i class="fas fa-birthday-cake"></i> School Anniversary Countdown</h2><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:1.5rem"><div><div style="font-size:2rem;font-weight:800" id="daysLeft">0</div><div>Days</div></div><div><div style="font-size:2rem;font-weight:800" id="hoursLeft">0</div><div>Hours</div></div><div><div style="font-size:2rem;font-weight:800" id="minutesLeft">0</div><div>Minutes</div></div><div><div style="font-size:2rem;font-weight:800" id="secondsLeft">0</div><div>Seconds</div></div></div></div>
<div style="background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:15px;padding:2rem"><h2 class="section-title"><i class="fas fa-project-diagram"></i> School Timeline</h2><div id="schoolTimeline"><div class="loading-skeleton" style="height:100px"></div></div></div>
</div></div>
<script src="../js/mobile-shell.js?v=260903c"></script><script type="module" src="../js/app.js?v=260903c"></script>
<script>(function(){document.documentElement.classList.remove('hshs-booting');document.documentElement.classList.add('hshs-ready');})();</script></body></html>
