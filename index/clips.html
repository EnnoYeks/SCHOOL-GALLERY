<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
    <meta name="theme-color" content="#6366f1">
    <title>Clips - HSHS International</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/clips.css">
</head>
<body class="light-mode clips-page">
    <div class="animated-bg">
        <div class="gradient-bg"></div>
        <div class="particles-container" id="particlesContainer"></div>
    </div>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo"><i class="fas fa-graduation-cap"></i><span>HSHS</span></div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search clips..." class="search-input" id="searchInput">
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="nav-links"></div>
            <div class="nav-actions">
                <div class="notification-icon">
                    <i class="fas fa-bell"></i>
                    <span class="notification-badge" id="notificationBadge">0</span>
                    <div class="notification-dropdown" id="notificationDropdown">
                        <div class="notifications-list" id="notificationsList"><p class="empty-state">No notifications</p></div>
                    </div>
                </div>
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
                <div class="profile-icon">
                    <img src="https://via.placeholder.com/40" alt="Profile" class="profile-img" id="profileImg">
                    <div class="profile-dropdown" id="profileDropdown">
                        <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> My Profile</a>
                        <a href="settings.html" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>
    <main class="clips-main">
        <div class="clip-feed" id="clipFeed"></div>
    </main>
    <div class="clip-sheet" id="commentSheet">
        <div class="clip-sheet-handle"></div>
        <h3>Comments</h3>
        <div class="comment-list" id="commentList"></div>
        <form class="comment-form" id="commentForm">
            <input type="text" id="commentInput" placeholder="Say something kind..." maxlength="160" autocomplete="off">
            <button type="submit"><i class="fas fa-paper-plane"></i></button>
        </form>
    </div>
    <div class="clip-sheet" id="musicSheet">
        <div class="clip-sheet-handle"></div>
        <h3>School Mix</h3>
        <p class="clip-sheet-note">Pick a track from the school library. Random internet songs are not allowed.</p>
        <div class="music-list" id="musicList"></div>
    </div>
    <div class="clip-dim" id="clipDim"></div>
    <script src="../js/utils.js"></script>
    <script src="../js/particles.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/clips.js"></script>
    <script src="../js/mobile-navigation.js"></script>
</body>
</html>
