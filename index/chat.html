<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
    <meta name="description" content="HSHS World live school chat">
    <meta name="theme-color" content="#6366f1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta charset="UTF-8">
    <title>Chat - HSHS World</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/hshs-chat.css">
    <style>
        input[type="text"], textarea { font-size: 16px !important; }
    </style>
</head>
<body class="light-mode">
    <div class="animated-bg">
        <div class="gradient-bg"></div>
        <div class="particles-container" id="particlesContainer"></div>
    </div>

    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <span>HSHS</span>
            </div>
            <div class="nav-links"></div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" type="button">
                    <i class="fas fa-moon"></i>
                </button>
            </div>
        </div>
    </nav>

    <div class="hshs-chat-page" id="hshsChatPage">
        <header class="hshs-chat-top">
            <div>
                <h1>Chat</h1>
                <p id="hshsChatStatus">Connecting to Firestore…</p>
            </div>
            <div class="hshs-chat-me" id="hshsChatMe">You</div>
        </header>

        <div class="hshs-chat-layout">
            <aside class="hshs-chat-side" id="hshsChatSide">
                <div class="hshs-chat-search">
                    <i class="fas fa-search"></i>
                    <input type="search" id="hshsChatSearch" placeholder="Search school contacts" autocomplete="off">
                </div>
                <div class="hshs-chat-list" id="hshsChatList">
                    <div class="hshs-chat-empty">Loading contacts…</div>
                </div>
            </aside>

            <section class="hshs-chat-main" id="hshsChatMain">
                <div class="hshs-chat-empty-main" id="hshsChatEmptyMain">
                    <i class="fas fa-comments"></i>
                    <h2>School chat</h2>
                    <p>Pick a contact to start a live conversation. Messages sync through Firestore.</p>
                </div>

                <div class="hshs-thread" id="hshsThread" hidden>
                    <div class="hshs-thread-head">
                        <button type="button" class="hshs-thread-back" id="hshsThreadBack" aria-label="Back">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div>
                            <strong id="hshsThreadName">Contact</strong>
                            <small id="hshsThreadMeta">Live</small>
                        </div>
                    </div>
                    <div class="hshs-thread-msgs" id="hshsThreadMsgs"></div>
                    <form class="hshs-thread-compose" id="hshsThreadForm">
                        <input type="text" id="hshsThreadInput" placeholder="Message…" maxlength="800" autocomplete="off">
                        <button type="submit" aria-label="Send"><i class="fas fa-paper-plane"></i></button>
                    </form>
                </div>
            </section>
        </div>
    </div>

    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/db.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/navigation.js"></script>
    <script type="module" src="../js/hshs-chat.js"></script>
    <script src="../js/mobile-navigation.js"></script>
</body>
</html>
