<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
  <meta name="description" content="HSHS World · School community media platform">
  <meta name="theme-color" content="#071433">
  <title>Chat · HSHS World</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
  <link rel="stylesheet" href="../css/hshs-fonts.css?v=260926blank1">
  <link rel="stylesheet" href="../css/foundation.css?v=260926blank1">
  <link rel="stylesheet" href="../css/hshs-glass.css?v=260926blank1">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>(function(){var r=document.documentElement;r.classList.add('hshs-ready','hshs-js-first');r.classList.add(window.matchMedia('(max-width:1024px)').matches?'hshs-device-mobile':'hshs-device-desktop');var s=document.createElement('div');var ok=('backdropFilter' in s.style)||('webkitBackdropFilter' in s.style);if(!ok)r.classList.add('hshs-no-backdrop');window.__hshsTplChat=true;window.HshsTemplates=window.HshsTemplates||{};window.HshsTemplates.chat='<main id="hshsChatBlank" class="hshs-chat-blank-canvas" aria-label="Chat"></main>';})();</script>
  <style>
    .hshs-chat-blank-canvas{min-height:calc(100dvh - 128px);background:transparent}
    .hshs-chat-page,.msg-hero,.msg-search,.msg-list-view,.msg-list-scroll,.msg-fab-compose,.msg-thread-view,.hshs-chat-empty,#hshsChatPage,#hshsChatList,#hshsComposeFab,#hshsThread{display:none!important}
  </style>
</head>
<body class="dark-mode">
  <div id="hshs-page"></div>
  <script type="module" src="../js/config.js?v=260926blank1"></script>
  <script type="module" src="../js/db.js?v=260926blank1"></script>
  <script src="../js/utils.js?v=260926blank1"></script>
  <script src="../js/theme.js?v=260926blank1"></script>
  <script src="../js/navigation.js?v=260926blank1"></script>
  <script src="../js/mobile-navigation.js?v=260926blank1"></script>
  <script src="../js/search.js?v=260926blank1"></script>
  <script src="../js/core/navigation-perf.js?v=260926blank1"></script>
  <script src="../js/mobile-shell.js?v=260926blank1"></script>
  <script src="../js/core/bootstrap.js?v=260926blank1"></script>
  <script src="../js/pages/chat.js?v=260926blank1"></script>
  <script>
  (function () {
    var BLANK = '<main id="hshsChatBlank" class="hshs-chat-blank-canvas" aria-label="Chat"></main>';
    function blank() {
      window.__hshsTplChat = true;
      window.HshsTemplates = window.HshsTemplates || {};
      window.HshsTemplates.chat = BLANK;
      var root = document.getElementById('hshs-page');
      if (!root) return;
      var old = root.querySelector('.hshs-chat-page, .msg-hero, .msg-search, .msg-list-view, .msg-fab-compose, .hshs-chat-empty, #hshsChatPage, #hshsThread');
      if (old) {
        var keep = [];
        root.querySelectorAll('.navbar, .mobile-tabbar, #mobileTabbar').forEach(function (el) { keep.push(el); });
        root.innerHTML = BLANK;
        keep.forEach(function (el) { document.body.appendChild(el); });
        return;
      }
      if (!root.querySelector('#hshsChatBlank')) root.innerHTML = BLANK;
    }
    var busy = false;
    function safeBlank() {
      if (busy) return;
      busy = true;
      try { blank(); } catch (e) {}
      busy = false;
    }
    document.addEventListener('hshs:page', function () { setTimeout(safeBlank, 20); });
    document.addEventListener('hshs:foundation-ready', function () { setTimeout(safeBlank, 20); });
    [40, 180, 500, 1200].forEach(function (ms) { setTimeout(safeBlank, ms); });
    if (document.body) {
      new MutationObserver(function () { setTimeout(safeBlank, 0); }).observe(document.body, { childList: true, subtree: true });
    }
  })();
  </script>
</body>
</html>
