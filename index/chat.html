<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"><title>Chat - HSHS World</title><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"><link rel="stylesheet" href="../css/style.css"><link rel="stylesheet" href="../css/hshs-chat.css"><link rel="stylesheet" href="../css/hshs-social.css"><link rel="stylesheet" href="../css/mobile-shell.css?v=260903c"></head>
<body class="light-mode"><nav class="navbar"><div class="navbar-container"><div class="logo"><i class="fas fa-graduation-cap"></i><span>HSHS World</span></div></div></nav>
<div id="app-root" data-page="chat">
<div class="hshs-chat-page" id="hshsChatPage" data-theme="ocean" data-bubbles="rounded">
<div id="hshsChatBanner" class="hshs-chat-banner" hidden></div>
<div class="hshs-chat-layout">
<aside class="hshs-chat-side" id="hshsChatSide">
<div class="hshs-side-head"><h1>Chats</h1><div class="hshs-side-actions"><select id="hshsThemeSelect" aria-label="Chat theme"><option value="ocean">Ocean</option><option value="grape">Grape</option><option value="mint">Mint</option><option value="sunset">Sunset</option><option value="rose">Rose</option><option value="slate">Slate</option></select><span class="hshs-chat-me" id="hshsChatMe" style="display:none">You</span></div></div>
<div class="hshs-chat-search"><i class="fas fa-search"></i><input type="search" id="hshsChatSearch" placeholder="Search or start new chat" autocomplete="off"></div>
<div class="hshs-chat-list" id="hshsChatList"><div class="hshs-chat-empty">Loading chats…</div></div>
</aside>
<section class="hshs-chat-main" id="hshsChatMain">
<div class="hshs-chat-empty-main" id="hshsChatEmptyMain"><div class="hshs-empty-art" aria-hidden="true">💬</div><h2>HSHS World Chat</h2><p>Pick a classmate on the left. Messages stay live with receipts, emojis, photos and voice notes.</p></div>
<div class="hshs-thread" id="hshsThread" hidden>
<div class="hshs-thread-head"><button type="button" class="hshs-thread-back" id="hshsThreadBack" aria-label="Back"><i class="fas fa-arrow-left"></i></button><img id="hshsThreadAvatar" alt=""><div><strong id="hshsThreadName"></strong><small id="hshsThreadMeta"></small></div></div>
<div class="hshs-thread-msgs" id="hshsThreadMsgs"></div>
<div id="hshsAttachPreview" hidden><button type="button" id="hshsClearAttach">x</button></div>
<div id="hshsEmojiPanel" hidden></div>
<div class="hshs-compose-wrap" id="hshsComposeWrap">
<div id="hshsRecBar" hidden><span id="hshsRecTimer">0:00</span><span id="hshsRecSlide">slide to cancel</span><button type="button" id="hshsRecCancel">Cancel</button></div>
<form id="hshsThreadForm"><button type="button" id="hshsEmojiBtn">😊</button><input id="hshsThreadInput" placeholder="Message" autocomplete="off"><button type="button" id="hshsAttachBtn"><i class="fas fa-paperclip"></i></button><button type="button" id="hshsCameraBtn"><i class="fas fa-camera"></i></button><button type="button" id="hshsVoiceBtn"><i class="fas fa-microphone"></i></button><button type="submit" id="hshsSendBtn"><i class="fas fa-paper-plane"></i></button></form>
<input id="hshsAttachInput" type="file" hidden><input id="hshsCameraInput" type="file" accept="image/*" capture="environment" hidden>
</div></div></section></div></div></div>
<script src="../js/hshs-store.js"></script><script src="../js/hshs-social.js"></script><script type="module" src="../js/hshs-chat.js"></script>
<script src="../js/mobile-shell.js?v=260903c"></script><script type="module" src="../js/app.js?v=260903c"></script>
<script>(function(){document.documentElement.classList.remove('hshs-booting');document.documentElement.classList.add('hshs-ready');})();</script></body></html>
