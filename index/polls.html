<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
<title>Polls - HSHS World</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/mobile-shell.css?v=260903c">
<link rel="stylesheet" href="../css/hshs-theme.css?v=260903c">
</head>
<body class="light-mode">
<div class="animated-bg"><div class="gradient-bg"></div><div class="particles-container" id="particlesContainer"></div></div>
<nav class="navbar"><div class="navbar-container"><div class="logo"><i class="fas fa-graduation-cap"></i><span>HSHS World</span></div></div></nav>
<div id="app-root" data-page="polls" aria-live="polite">
<div class="container" style="padding:2rem;position:relative;z-index:10;margin-top:60px;max-width:800px">
<div style="background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));border-radius:20px;padding:3rem;color:white;margin-bottom:3rem;text-align:center">
<h1 style="font-size:2.5rem;font-weight:800;margin-bottom:1rem"><i class="fas fa-poll"></i> Live Polls</h1>
<p style="font-size:1.1rem;opacity:.95">Vote on your favorite events, people, and things!</p>
</div>
<div id="activePollsList"></div>
<button style="width:100%;padding:1rem;margin-top:2rem;border:none;border-radius:10px;background:linear-gradient(135deg,var(--primary-color),var(--secondary-color));color:white;font-size:1rem;font-weight:600" id="createPollBtn" type="button"><i class="fas fa-plus"></i> Create New Poll</button>
<div style="margin-top:4rem"><h2 class="section-title"><i class="fas fa-history"></i> Closed Polls</h2><div id="closedPollsList"></div></div>
</div>
</div>
<script src="../js/mobile-shell.js?v=260903c"></script>
<script type="module" src="../js/app.js?v=260903c"></script>
<script>(function(){document.documentElement.classList.remove('hshs-booting');document.documentElement.classList.add('hshs-ready');})();</script>
</body></html>
