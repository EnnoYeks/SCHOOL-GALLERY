<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#071433">
<title>HSHS Vibe | HSHS International</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/videos.css">
<link rel="stylesheet" href="../css/vibe.css">
<link rel="stylesheet" href="../css/hshs-no-flicker.css?v=260903b">
<link rel="stylesheet" href="../css/mobile-shell.css?v=260903b">
<link rel="stylesheet" href="../css/hshs-theme.css?v=260903b">
<style>input, textarea, select { font-size: 16px !important; }</style>
</head>
<body class="dark-mode">
<div class="animated-bg"><div class="gradient-bg"></div><div class="particles-container" id="particlesContainer"></div><div class="floating-shapes"><div class="shape shape-1"></div><div class="shape shape-2"></div><div class="shape shape-3"></div><div class="shape shape-4"></div></div></div>
<nav class="navbar"><div class="navbar-container">
<a class="logo" href="../index.html"><i class="fas fa-graduation-cap"></i><span>HSHS International</span></a>
<div class="search-container"><i class="fas fa-search"></i><input type="text" placeholder="Search Vibe..." class="search-input" id="searchInput" autocomplete="off"><div class="search-results" id="searchResults"></div></div>
<div class="nav-links"></div>
<div class="nav-actions">
<div class="notification-icon"><i class="fas fa-bell"></i><span class="notification-badge" id="notificationBadge">0</span></div>
<button class="theme-toggle" id="themeToggle" type="button"><i class="fas fa-moon"></i></button>
<div class="profile-icon"><img src="https://via.placeholder.com/40" alt="Profile" class="profile-img" id="profileImg"></div>
</div></div></nav>
<div id="app-root" data-page="videos" aria-live="polite">
<main class="vibe-page" id="vibePage">
<section class="vibe-hero-card">
<div class="vibe-hero-copy">
<span class="vibe-kicker"><i class="fas fa-play"></i> HSHS MEDIA</span>
<h1>School <em>Vibe</em></h1>
<p>Big moments, real memories and the stories happening around HSHS.</p>
<button class="vibe-upload" id="uploadVideoBtn" type="button"><i class="fas fa-plus"></i> Upload Video</button>
</div>
<div class="vibe-dots"><span class="on"></span><span></span><span></span><span></span><span></span></div>
</section>
<div class="vibe-tabs video-tabs" role="tablist" aria-label="Vibe categories">
<button class="vibe-tab video-tab active" data-filter="all"><i class="fas fa-th"></i> All</button>
<button class="vibe-tab video-tab" data-filter="trending"><i class="fas fa-fire"></i> Trending</button>
<button class="vibe-tab video-tab" data-filter="latest"><i class="fas fa-bolt"></i> Latest</button>
<button class="vibe-tab video-tab" data-filter="sports"><i class="fas fa-futbol"></i> Sports</button>
<button class="vibe-tab video-tab" data-filter="events"><i class="fas fa-calendar"></i> Events</button>
<button class="vibe-tab video-tab" data-filter="academics"><i class="fas fa-book"></i> Academics</button>
</div>
<section class="featured-video-section" id="featuredVideoSection">
<div class="vibe-row-head"><h2>Featured</h2><button type="button" data-filter-jump="all">View all →</button></div>
<div class="vibe-featured" id="featuredVideo"></div>
</section>
<section class="video-library-section">
<div class="vibe-row-head"><h2 id="videoSectionTitle">Latest Videos</h2><button type="button" data-filter-jump="latest">View all →</button></div>
<div class="vibe-list videos-container" id="videosContainer"></div>
<button class="load-more-videos" id="loadMoreVideos" hidden>Load more <i class="fas fa-arrow-down"></i></button>
</section>
</main>
<div class="video-player-modal" id="videoPlayerModal" role="dialog" aria-modal="true" aria-label="Video player">
<div class="video-player-container">
<button class="player-close" id="playerClose" aria-label="Close player"><i class="fas fa-times"></i></button>
<video class="video-player" id="videoPlayer" playsinline preload="metadata"></video>
<div class="player-side-actions">
<button class="player-action-btn" type="button" id="prevVideo"><i class="fas fa-chevron-left"></i></button>
<button class="player-action-btn" type="button" id="nextVideo"><i class="fas fa-chevron-right"></i></button>
</div>
<div class="video-controls">
<button class="control-btn" id="playPauseBtn"><i class="fas fa-play"></i></button>
<span class="time-display" id="currentTime">0:00</span>
<div class="progress-bar" id="progressBar"><div class="progress-fill" id="progressFill"></div></div>
<span class="time-display" id="durationTime">0:00</span>
<button class="control-btn" id="fullscreenBtn"><i class="fas fa-expand"></i></button>
</div></div></div>
</div>
<script src="../js/vibe-skel.js"></script>
<script type="module" src="../js/config.js"></script>
<script type="module" src="../js/db.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/particles.js"></script>
<script src="../js/theme.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/search.js"></script>
<script src="../js/mobile-navigation.js"></script>
<script src="../js/videos.js"></script>
<script src="../js/mobile-shell.js?v=260903b"></script>
<script src="../js/mobile-search-btn.js?v=260903b"></script>
<script type="module" src="../js/app.js?v=260903b"></script>
<script>(function(){var r=document.documentElement;r.classList.remove('hshs-booting');r.classList.add('hshs-ready');if(document.body)document.body.classList.add('has-mobile-shell');window.dispatchEvent(new CustomEvent('app:page:loaded'));})();</script>
</body></html>
