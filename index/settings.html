  <style>
    html, body { background: #071433; margin: 0; }
    #hshs-page { min-height: 100vh; background: #071433; opacity: 1 !important; visibility: visible !important; }
    .hshs-load-skel {
      position: fixed;
      inset: 0;
      z-index: 5000;
      min-height: 100vh;
      background:
        radial-gradient(520px 280px at 50% 18%, rgba(212, 175, 55, 0.16), transparent 62%),
        #071433;
      overflow: hidden;
      opacity: 1 !important;
      visibility: visible !important;
    }
    body:has(.hshs-load-skel) #hshs-boot { display: none !important; }
    .hshs-load-skel::before,
    .hshs-load-skel::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
    }
    .hshs-load-skel::before { top: 88px; height: 148px; }
    .hshs-load-skel::after {
      top: 252px;
      height: 72px;
      box-shadow: 0 88px 0 rgba(255, 255, 255, 0.04), 0 176px 0 rgba(255, 255, 255, 0.04);
    }
    .hshs-load-skel-shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 18%, rgba(251, 191, 36, 0.16) 48%, transparent 78%);
      transform: translateX(-120%);
      animation: hshs-skel-shimmer 1.35s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes hshs-skel-shimmer {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hshs-load-skel-shine { animation: none; opacity: 0.35; }
    }
  </style>
</head>
<body class="dark-mode">
    <div id="hshs-page" style="opacity:1!important;visibility:visible!important">
    <div class="hshs-load-skel" role="status" aria-label="Loading">
      <span class="hshs-load-skel-shine" aria-hidden="true"></span>
    </div>
  </div>
  <script>
    (function () {
      var root = document.getElementById('hshs-page');
      if (!root) return;
      function reveal() {
        var r = document.documentElement;
        r.classList.remove('hshs-booting');
        r.classList.add('hshs-ready');
        window.__hshsBootDone = true;
        var boot = document.getElementById('hshs-boot');
        if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        var cover = document.getElementById('hshs-tt-overlay');
        if (cover && cover.parentNode) cover.parentNode.removeChild(cover);
      }
      window.__hshsRevealPage = reveal;
      function dropSkel() {
        var sk = root.querySelector('.hshs-load-skel');
        if (sk && sk.parentNode) sk.parentNode.removeChild(sk);
      }
      function settled() {
        if (!root.querySelector('.hshs-load-skel')) return root.childElementCount > 0;
        return root.childElementCount > 1;
      }
      function check() {
        if (!settled()) return;
        if (window.__hshsSkelWatch) window.__hshsSkelWatch.disconnect();
        dropSkel();
        reveal();
      }
      if (window.MutationObserver) {
        var obs = new MutationObserver(check);
        window.__hshsSkelWatch = obs;
        obs.observe(root, { childList: true });
      }
      setTimeout(function () {
        if (document.documentElement.classList.contains('hshs-ready') && !root.querySelector('.hshs-load-skel')) return;
        dropSkel();
        reveal();
      }, 12000);
    })();
  </script>
