<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
    <meta name="theme-color" content="#12306b">
    <title>Profile | HSHS World</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/profile.css">
</head>
<body class="light-mode">
    <div class="animated-bg">
        <div class="gradient-bg"></div>
        <div class="particles-container" id="particlesContainer"></div>
    </div>
    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo"><i class="fas fa-graduation-cap"></i><span>HSHS World</span></div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search..." class="search-input" id="searchInput">
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="nav-links">
                <a href="../index.html" class="nav-link"><i class="fas fa-home"></i><span>Home</span></a>
                <a href="gallery.html" class="nav-link"><i class="fas fa-images"></i><span>Gallery</span></a>
                <a href="profile.html" class="nav-link active"><i class="fas fa-user"></i><span>Profile</span></a>
            </div>
            <div class="nav-actions">
                <div class="notification-icon"><i class="fas fa-bell"></i><span class="notification-badge" id="notificationBadge">0</span></div>
                <button class="theme-toggle" id="themeToggle"><i class="fas fa-moon"></i></button>
                <div class="profile-icon"><img src="https://via.placeholder.com/40" alt="Profile" class="profile-img" id="profileImg"></div>
            </div>
        </div>
    </nav>

    <main class="profile-page" id="profileRoot">
        <section id="guestBox" class="p-card-box">
            <h2>Join HSHS World</h2>
            <p>Create a school account or sign in. This is local for now — Firebase comes next.</p>
            <div class="auth-tabs">
                <button type="button" class="auth-tab on" data-tab="signup">Create account</button>
                <button type="button" class="auth-tab" data-tab="login">Sign in</button>
            </div>
            <form id="signupForm" class="p-form">
                <input id="suName" placeholder="Full name" required>
                <input id="suUser" placeholder="Username" required>
                <input id="suPass" type="password" placeholder="Passcode (4+ characters)" required>
                <input id="suClass" placeholder="Class / year (e.g. S4)">
                <input id="suHouse" placeholder="House (optional)">
                <textarea id="suBio" rows="2" placeholder="Short bio"></textarea>
                <button type="submit">Create account</button>
            </form>
            <form id="loginForm" class="p-form">
                <input id="liUser" placeholder="Username" required>
                <input id="liPass" type="password" placeholder="Passcode" required>
                <button type="submit">Sign in</button>
                <small>Demo clubs: sports / science / prefects — passcode hshs123</small>
            </form>
        </section>

        <section id="memberBox" style="display:none">
            <div class="p-hero">
                <img id="pAvatar" src="https://via.placeholder.com/120" alt="Profile">
                <h1 id="pName">Student</h1>
                <small id="pHandle">@user</small>
                <p id="pMeta">Student</p>
                <div class="p-stats">
                    <div><b id="pPosts">0</b><span>Posts</span></div>
                    <div><b id="pFollowers">0</b><span>Followers</span></div>
                    <div><b id="pFollowing">0</b><span>Following</span></div>
                </div>
                <button type="button" class="p-btn ghost" id="pLogout" style="margin-top:12px">Sign out</button>
            </div>
            <div class="p-card-box">
                <h2>About</h2>
                <p id="pBio"></p>
            </div>
            <div class="p-card-box">
                <h2>Edit profile</h2>
                <form id="editForm" class="p-form">
                    <input id="editName" placeholder="Name">
                    <input id="editClass" placeholder="Class">
                    <input id="editHouse" placeholder="House">
                    <textarea id="editBio" rows="2" placeholder="Bio"></textarea>
                    <button type="submit">Save profile</button>
                </form>
            </div>
            <div class="p-card-box">
                <h2>New post</h2>
                <form id="postForm" class="p-form">
                    <input id="npTitle" placeholder="Title" required>
                    <textarea id="npDesc" rows="2" placeholder="What happened?"></textarea>
                    <select id="npCat">
                        <option value="events">Events</option>
                        <option value="sports">Sports</option>
                        <option value="academics">Academics</option>
                        <option value="club">Club</option>
                    </select>
                    <select id="npType">
                        <option value="photo">Photo</option>
                        <option value="video">Vibe clip</option>
                    </select>
                    <input id="npImage" placeholder="Image link (optional)">
                    <button type="submit">Publish</button>
                </form>
            </div>
            <div class="p-card-box">
                <h2>My posts</h2>
                <div id="myPosts" class="p-grid"></div>
            </div>
        </section>
    </main>

    <script type="module" src="../js/config.js"></script>
    <script type="module" src="../js/db.js"></script>
    <script src="../js/hshs-store.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/theme.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/search.js"></script>
    <script src="../js/profile.js"></script>
    <script src="../js/hshs-app.js"></script>
</body>
</html>
