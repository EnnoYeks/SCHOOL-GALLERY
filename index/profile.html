<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
    <meta charset="UTF-8">
    <meta name="theme-color" content="#6366f1">
    <title>Profile - HSHS World</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css?v=260904r">
    <link rel="stylesheet" href="../css/animations.css?v=260904r">
    <link rel="stylesheet" href="../css/responsive.css?v=260904r">
    <link rel="stylesheet" href="../css/hshs-social.css?v=260904r">
    <style>input, textarea, select { font-size: 16px !important; }</style>
    <link rel="stylesheet" href="../css/hshs-no-flicker.css?v=260904r">
    <link rel="stylesheet" href="../css/theme.css?v=260904r">
    <link rel="stylesheet" href="../css/mobile-shell.css?v=260904r">
    <link rel="stylesheet" href="../css/hshs-polish.css?v=260904r">
    <link rel="stylesheet" href="../css/hshs-account.css?v=260904r">
</head>
<body class="light-mode">
    <div class="animated-bg">
        <div class="gradient-bg"></div>
        <div class="particles-container" id="particlesContainer"></div>
    </div>

    <nav class="navbar">
        <div class="navbar-container">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i>
                <span>HSHS</span>
            </div>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search @username or people..." class="search-input" id="searchInput">
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="nav-links"></div>
            <div class="nav-actions">
                <button class="theme-toggle" id="themeToggle" type="button"><i class="fas fa-moon"></i></button>
            </div>
        </div>
    </nav>

    <div id="hshsProfileRoot">
        <div class="hshs-profile-empty">Loading profile…</div>
    </div>

    <script type="module" src="../js/config.js?v=260904r"></script>
    <script type="module" src="../js/db.js?v=260904r"></script>
    <script src="../js/utils.js?v=260904r"></script>
    <script src="../js/theme.js?v=260904r"></script>
    <script src="../js/navigation.js?v=260904r"></script>
    <script src="../js/hshs-store.js?v=260904r"></script>
    <script src="../js/hshs-social.js?v=260904r"></script>
    <script src="../js/mobile-navigation.js?v=260904r"></script>
    <script src="../js/particles.js?v=260904r"></script>
    <script src="../js/search.js?v=260904r"></script>
    <script src="../js/mobile-shell.js?v=260904r"></script>
    <script src="../js/profile-controller.js?v=260904r"></script>
</body>
</html>
