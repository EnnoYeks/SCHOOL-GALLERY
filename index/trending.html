<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
    <meta name="description" content="ENNOYEKS School Gallery - Trending school moments">
    <meta name="theme-color" content="#6366f1">
    <title>Trending - ENNOYEKS School Gallery</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link rel="stylesheet" href="../css/trending.css">
</head>
<body class="light-mode">
    <div class="animated-bg" aria-hidden="true">
        <div class="gradient-bg"></div>
        <div class="particles-container" id="particlesContainer"></div>
        <div class="floating-shapes">
            <div class="shape shape-1"></div><div class="shape shape-2"></div>
            <div class="shape shape-3"></div><div class="shape shape-4"></div>
        </div>
    </div>

    <nav class="navbar">
        <div class="navbar-container">
            <a class="logo" href="../index.html"><i class="fas fa-graduation-cap"></i><span>ENNOYEKS</span></a>
            <div class="search-container">
                <i class="fas fa-search"></i>
                <input type="text" placeholder="Search trending..." class="search-input" id="searchInput" autocomplete="off">
                <div class="search-results" id="searchResults"></div>
            </div>
            <div class="nav-links">
                <a href="../index.html" class="nav-link"><i class="fas fa-home"></i><span>Home</span></a>
                <a href="gallery.html" class="nav-link"><i class="fas fa-images"></i><span>Gallery</span></a>
                <a href="videos.html" class="nav-link"><i class="fas fa-video"></i><span>Videos</span></a>
                <a href="trending.html" class="nav-link active"><i class="fas fa-fire"></i><span>Trending</span></a>
                <a href="spotlight.html" class="nav-link"><i class="fas fa-star"></i><span>Spotlight</span></a>
            </div>
            <div class="nav-actions">
                <div class="notification-icon" id="notificationIcon">
                    <i class="fas fa-bell"></i><span class="notification-badge" id="notificationBadge" hidden>0</span>
                    <div class="notification-dropdown" id="notificationDropdown"><div class="notifications-list" id="notificationsList"><p class="empty-state">No notifications</p></div></div>
                </div>
                <button class="theme-toggle" id="themeToggle" type="button" aria-label="Toggle theme"><i class="fas fa-moon"></i></button>
                <div class="profile-icon">
                    <img src="https://via.placeholder.com/40" alt="Profile" class="profile-img" id="profileImg">
                    <div class="profile-dropdown" id="profileDropdown">
                        <a href="profile.html" class="dropdown-item"><i class="fas fa-user"></i> My Profile</a>
                        <a href="settings.html" class="dropdown-item"><i class="fas fa-cog"></i> Settings</a>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <main class="trending-page">
        <div class="container">
            <header class="trending-header">
                <span class="trending-kicker"><i class="fas fa-fire"></i> HSHS NOW</span>
                <h1>Trending</h1>
                <p>The moments everyone is talking about.</p>
            </header>

            <div class="trending-tabs" data-trending-tabs aria-label="Trending period">
                <button class="trending-tab active" data-period="today" type="button">Today</button>
                <button class="trending-tab" data-period="week" type="button">This Week</button>
                <button class="trending-tab" data-period="month" type="button">This Month</button>
            </div>

            <div class="trending-layout">
                <section class="trending-main" aria-label="Trending posts">
                    <div class="trending-grid" id="trendingGrid"></div>
                </section>

                <aside class="trending-sidebar" aria-label="Trending rankings">
                    <section class="sidebar-card">
                        <h3><i class="fas fa-layer-group"></i> Top Categories</h3>
                        <div class="top-categories" id="topCategoriesGrid"></div>
                    </section>
                    <section class="sidebar-card">
                        <h3><i class="fas fa-heart"></i> Top Liked</h3>
                        <ol class="leaderboard-list" id="topLikedList"></ol>
                    </section>
                    <section class="sidebar-card">
                        <h3><i class="fas fa-eye"></i> Most Viewed</h3>
                        <ol class="leaderboard-list" id="topViewedList"></ol>
                    </section>
                    <section class="sidebar-card">
                        <h3><i class="fas fa-comments"></i> Most Discussed</h3>
                        <ol class="leaderboard-list" id="topCommentedList"></ol>
                    </section>
                </aside>
            </div>
        </div>
    </main>

    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
        <a href="../index.html"><i class="fas fa-home"></i><span>Home</span></a>
        <a href="gallery.html"><i class="fas fa-images"></i><span>Gallery</span></a>
        <a href="spotlight.html"><i class="fas fa-star"></i><span>Spotlight</span></a>
        <a href="buzz.html"><i class="fas fa-bolt"></i><span>Buzz</span></a>
        <a href="trending.html" class="active"><i class="fas fa-fire"></i><span>Trending</span></a>
    </nav>

    <script type="module" src="../js/trending.js"></script>
</body>
</html>
