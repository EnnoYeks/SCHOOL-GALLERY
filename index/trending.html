<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
<title>Trending - HSHS School Gallery</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/animations.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/trending.css">
<link rel="stylesheet" href="../css/mobile-shell.css?v=260903c">
<link rel="stylesheet" href="../css/hshs-theme.css?v=260903c">
</head>
<body class="dark-mode trending-body">
<div class="animated-bg"><div class="gradient-bg"></div><div class="particles-container" id="particlesContainer"></div></div>
<nav class="navbar"><div class="navbar-container"><div class="logo"><i class="fas fa-graduation-cap"></i><span>HSHS World</span></div><div class="search-container"><i class="fas fa-search"></i><input class="search-input" id="searchInput" placeholder="Search..."></div></div></nav>
<div id="app-root" data-page="trending" aria-live="polite">
<main class="trending-page"><div class="container">
<header class="trending-header"><div class="trending-title-row"><div><span class="trending-kicker"><i class="fas fa-arrow-trend-up"></i> HSHS NOW</span><h1>Trending</h1><p>What's hot in our school right now</p></div><label class="period-picker"><select id="periodSelect"><option value="today">Today</option><option value="week" selected>This Week</option><option value="month">This Month</option></select></label></div></header>
<div class="trending-filters" data-content-filter>
<button class="content-filter active" data-filter="all" type="button">All</button>
<button class="content-filter" data-filter="video" type="button"><i class="fas fa-clapperboard"></i> Videos</button>
<button class="content-filter" data-filter="image" type="button"><i class="fas fa-image"></i> Photos</button>
<button class="content-filter" data-filter="events" type="button"><i class="fas fa-calendar-days"></i> Events</button>
<button class="content-filter" data-filter="buzz" type="button"><i class="fas fa-bullseye"></i> Buzz</button>
</div>
<section class="top-trending"><div id="topTrendingHero"></div><div id="topTrendingSide"></div></section>
<section class="trending-section"><div class="section-heading"><div><h2>Trending Now</h2></div><button class="view-all-btn" id="viewAllTrending" type="button">View all</button></div><div class="trending-grid" id="trendingGrid"></div></section>
<section class="hot-topics-section"><div class="section-heading"><h2>Hot Topics</h2></div><div class="hot-topics" id="hotTopics"></div></section>
<section class="desktop-insights">
<div class="insight-card"><h3>Top Categories</h3><div id="topCategoriesGrid"></div></div>
<div class="insight-card"><h3>Top Liked</h3><ol class="leaderboard-list" id="topLikedList"></ol></div>
<div class="insight-card"><h3>Most Viewed</h3><ol class="leaderboard-list" id="topViewedList"></ol></div>
<div class="insight-card"><h3>Most Discussed</h3><ol class="leaderboard-list" id="topCommentedList"></ol></div>
</section>
</div></main>
</div>
<script src="../js/trending.js"></script>
<script src="../js/trending-ui.js"></script>
<script src="../js/mobile-shell.js?v=260903c"></script>
<script type="module" src="../js/app.js?v=260903c"></script>
<script>(function(){document.documentElement.classList.remove('hshs-booting');document.documentElement.classList.add('hshs-ready');})();</script>
</body></html>
