<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5">
<meta name="theme-color" content="#071433">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>HSHS World</title>
<script>
(function(){
  var r=document.documentElement;
  r.classList.remove('hshs-booting');
  r.classList.add('hshs-ready');
  r.classList.add(window.matchMedia('(max-width:1024px)').matches?'hshs-device-mobile':'hshs-device-desktop');
})();
</script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="css/style.css?v=260903d">
<link rel="stylesheet" href="css/animations.css?v=260903d">
<link rel="stylesheet" href="css/responsive.css?v=260903d">
<link rel="stylesheet" href="css/hshs-no-flicker.css?v=260903d">
<link rel="stylesheet" href="css/mobile-shell.css?v=260903d">
<link rel="stylesheet" href="css/hshs-theme.css?v=260903d">
<link rel="stylesheet" href="css/hshs-more.css?v=260903d">
<style>
html,body{background:#071433!important}
body.has-mobile-shell .hero-title{
  background:none!important;
  -webkit-text-fill-color:#fff!important;
  color:#fff!important;
}
body.has-mobile-shell .hero-text{
  position:relative;
  overflow:hidden;
  background:linear-gradient(135deg,#071a3d 0%,#12306b 42%,#1d4ed8 72%,#eab308 130%)!important;
}
body.has-mobile-shell .hero-text:after{
  content:"";
  position:absolute;right:-18px;top:8px;width:168px;height:168px;
  background:url('https://hawthorne-scribner.ac.ug/wp-content/uploads/2024/12/Hawthorne-Scribner-Badge-png-768x771.png') center/contain no-repeat;
  opacity:.18;pointer-events:none;
}
.hshs-welcome-kicker{
  display:inline-block;margin-bottom:.7rem;padding:.28rem .7rem;border-radius:999px;
  background:rgba(15,40,90,.55);color:#dbeafe;font-size:.68rem;font-weight:800;letter-spacing:.08em;
}
body.has-mobile-shell .footer{display:none}
@media (max-width:1024px){
  body.has-mobile-shell .navbar .search-container{display:none!important}
}
</style>
</head>
<body class="dark-mode has-mobile-shell">
<div class="animated-bg"><div class="gradient-bg"></div><div class="particles-container" id="particlesContainer"></div></div>
<nav class="navbar hshs-flat-top"><div class="navbar-container hshs-topbar">
<div class="logo">
  <span class="brand-mark"><img src="https://hawthorne-scribner.ac.ug/wp-content/uploads/2024/12/Hawthorne-Scribner-Badge-png-768x771.png" alt="HSHS badge" width="44" height="44"></span>
  <span class="brand-copy"><strong>HSHS World <i class="fas fa-circle-check brand-tick"></i></strong><small>Campus social</small></span>
</div>
<div class="search-container"><i class="fas fa-search"></i><input type="text" class="search-input" id="searchInput" placeholder="Search posts, students, events..."><div class="search-results" id="searchResults"></div></div>
<div class="nav-links"></div>
<div class="nav-actions hshs-top-actions">
  <div class="notification-icon"><i class="fas fa-bell"></i><span class="notification-badge" id="notificationBadge">0</span></div>
  <div class="profile-icon hshs-profile"><img class="profile-img hshs-avatar" id="profileImg" alt="Profile" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='32' fill='%231d4ed8'/%3E%3Ccircle cx='32' cy='24' r='10' fill='white'/%3E%3Cpath d='M14 54c4-12 14-18 18-18s14 6 18 18' fill='white'/%3E%3C/svg%3E"></div>
</div>
</div></nav>
<main id="app-root" data-page="home" aria-live="polite">
<section class="hero"><div class="hero-content"><div class="hero-text">
  <span class="hshs-welcome-kicker">WELCOME TO</span>
  <h1 class="hero-title">HSHS WORLD</h1>
  <p class="hero-subtitle">Your school. One world. Photos, Vibe, Buzz and memories.</p>
  <div class="hero-description">The HSHS home for school moments, achievements and community.</div>
  <div class="hero-buttons">
    <button class="btn btn-primary" id="exploreBtn" type="button"><i class="fas fa-play"></i> Explore Feed</button>
    <button class="btn btn-secondary" id="learnMoreBtn" type="button"><i class="fas fa-info-circle"></i> Learn More</button>
  </div>
</div></div></section>
<section class="featured-section"><div class="container">
  <h2 class="section-title"><i class="fas fa-crown"></i> Featured Today</h2>
  <div class="featured-grid" id="featuredGrid"></div>
</div></section>
<section class="quick-stats"><div class="container"><div class="stats-grid">
  <a class="stat-card" href="index/photos.html"><div class="stat-icon"><i class="fas fa-images"></i></div><div class="stat-content"><div class="stat-number" id="totalPhotos">0</div><div class="stat-label">Photos</div></div></a>
  <a class="stat-card" href="index/videos.html"><div class="stat-icon"><i class="fas fa-video"></i></div><div class="stat-content"><div class="stat-number" id="totalVideos">0</div><div class="stat-label">Vibe</div></div></a>
</div></div></section>
</main>
<script src="js/utils.js?v=260903d"></script>
<script src="js/theme.js?v=260903d"></script>
<script>
(function(){
  if (window.matchMedia('(max-width:1024px)').matches) {
    document.body.classList.remove('light-mode');
    document.body.classList.add('dark-mode','has-mobile-shell');
  }
})();
</script>
<script src="js/navigation.js?v=260903d"></script>
<script src="js/hshs-brand.js?v=260903d"></script>
<script src="js/mobile-search-btn.js?v=260903d"></script>
<script src="js/mobile-shell.js?v=260903d"></script>
<script src="js/mobile-navigation.js?v=260903d"></script>
<script type="module" src="js/config.js?v=260903d"></script>
<script type="module" src="js/db.js?v=260903d"></script>
<script type="module" src="js/app.js?v=260903d"></script>
<script>(function(){document.documentElement.classList.remove('hshs-booting');document.documentElement.classList.add('hshs-ready');})();</script>
</body></html>
