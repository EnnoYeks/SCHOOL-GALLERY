  <style>
    html, body { background: #071433; margin: 0; }
    #hshs-page { min-height: 100vh; background: #071433; }
    .hshs-load-skel {
      min-height: 100vh;
      background:
        radial-gradient(520px 280px at 50% 18%, rgba(212, 175, 55, 0.16), transparent 62%),
        #071433;
      position: relative;
      overflow: hidden;
    }
    .hshs-load-skel::before,
    .hshs-load-skel::after {
      content: "";
      position: absolute;
      left: 16px;
      right: 16px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.04);
    }
    .hshs-load-skel::before { top: 88px; height: 148px; }
    .hshs-load-skel::after {
      top: 252px;
      height: 72px;
      box-shadow: 0 88px 0 rgba(255, 255, 255, 0.04), 0 176px 0 rgba(255, 255, 255, 0.04);
    }
    .hshs-load-skel-shine {
      position: absolute;
      inset: 0;
      background: linear-gradient(100deg, transparent 18%, rgba(251, 191, 36, 0.16) 48%, transparent 78%);
      transform: translateX(-120%);
      animation: hshs-skel-shimmer 1.35s ease-in-out infinite;
      pointer-events: none;
    }
    @keyframes hshs-skel-shimmer {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(120%); }
    }
    @media (prefers-reduced-motion: reduce) {
      .hshs-load-skel-shine { animation: none; opacity: 0.35; }
    }
  </style>
  <script>(function(){var r=document.documentElement;r.classList.add('hshs-ready','hshs-js-first');r.classList.add(window.matchMedia('(max-width:1024px)').matches?'hshs-device-mobile':'hshs-device-desktop');var s=document.createElement('div');var ok=('backdropFilter' in s.style)||('webkitBackdropFilter' in s.style);if(!ok)r.classList.add('hshs-no-backdrop');})();</script>
</head>
<body class="dark-mode">
  <div id="hshs-page">
    <div class="hshs-load-skel" role="status" aria-label="Loading">
      <span class="hshs-load-skel-shine" aria-hidden="true"></span>
    </div>
  </div>
